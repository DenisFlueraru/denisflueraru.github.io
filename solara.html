<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solara - Denis Flueraru</title>
<link rel="icon" type="image/png" href="images/atomatlabfavicon.png">

<style>
/* Fonts */
@font-face {
  font-family: 'Neue Kaine';
  src: url('fonts/neue_kaine_variable-webfont.woff2') format('woff2'),
       url('fonts/neue_kaine_variable-webfont.woff') format('woff');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}
body, h1, h2, p, a, span {
  font-family: 'Neue Kaine', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:white; color:black; overflow-x:hidden; }

/* Header */
.header {
  position:fixed; top:0; width:100%;
  padding:25px 50px;
  display:flex; justify-content:space-between; align-items:center;
  background: linear-gradient(to bottom, white 0%, rgba(255,255,255,0) 100%);
  z-index:100;
}
.header .logo { font-weight:bold; font-size:20px; color:black; text-decoration:none; }
.header .section-title { font-weight:600; font-size:22px; text-align:center; flex:1; }

/* Main content */
.main-content { padding-top:120px; max-width:1000px; margin:0 auto; }

/* Gallery */
.gallery { display:flex; flex-direction:column; align-items:center; gap:20px; }
.main-image { width:100%; max-width:700px; border-radius:8px; cursor:pointer; }
.thumbnails { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.thumbnails img { width:120px; height:80px; object-fit:cover; border-radius:4px; cursor:pointer; opacity:0.7; transition:opacity 0.2s; }
.thumbnails img.active, .thumbnails img:hover { opacity:1; }

/* Arrows */
.arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  background:rgba(182,210,40,0.9); border:none; color:black;
  font-size:2em; cursor:pointer; padding:10px 15px; border-radius:50%;
  z-index:10;
}
.arrow.left { left:20px; }
.arrow.right { right:20px; }

/* Modal */
.modal { display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; }
.modal-content { max-width:90%; max-height:90%; border-radius:8px; }
.close { position:absolute; top:20px; right:30px; font-size:3em; color:white; cursor:pointer; }

/* Video */
.video-section { margin-top:40px; display:flex; justify-content:center; }
.video-section video { max-width:90%; border-radius:8px; }

/* Responsive */
@media(max-width:768px){
  .thumbnails img { width:80px; height:60px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a href="index.html" class="logo">Denis Flueraru</a>
  <span class="section-title">Solara</span>
</div>

<!-- Main -->
<div class="main-content">
  <div class="gallery">
    <!-- Main Image -->
    <div style="position:relative; width:100%; max-width:700px;">
      <button class="arrow left" onclick="prevImage()">&#10094;</button>
      <img id="mainImage" src="https://lh3.googleusercontent.com/d/1NrAP_IjU2pgLh01CuprZvIrZCZxXLRAf" class="main-image" onclick="openModal(this.src)">
      <button class="arrow right" onclick="nextImage()">&#10095;</button>
    </div>

    <!-- Thumbnails -->
    <div class="thumbnails" id="thumbnails">
      <img src="https://lh3.googleusercontent.com/d/1rO_WEHru-ZoNiVBxeeCwcjm13oNbnvOR" onclick="setMainImage(this)" class="active">
      <img src="https://lh3.googleusercontent.com/d/16K6ILZT43OdcKc0tlff2sk0oiG1kwW2t" onclick="setMainImage(this)">
      <img src="https://lh3.googleusercontent.com/d/1NrAP_IjU2pgLh01CuprZvIrZCZxXLRAf" onclick="setMainImage(this)">
      <img src="https://lh3.googleusercontent.com/d/1CscSYGMS1w-ycOuc89Cr3IM-Yeiuv9Qf" onclick="setMainImage(this)">
      <img src="https://lh3.googleusercontent.com/d/1KuX55MI1KdwHTv-gfWnc8wI8Edjc-MZG" onclick="setMainImage(this)">
      <img src="https://lh3.googleusercontent.com/d/1UPKVCIKONQLFX9P25ePmhwNdvkakECQh" onclick="setMainImage(this)">
      <img src="https://lh3.googleusercontent.com/d/1FBcFT_MCZHQIbAU4boCs-gIm5JDvYek9" onclick="setMainImage(this)">
    </div>
  </div>

  <!-- Video -->
  <div class="video-section">
    <video autoplay loop muted playsinline controls>
      <source src="https://lh3.googleusercontent.com/d/1-4PMiwZhG_nsuDIQapmgtmRyXrZfc7qG" type="video/mp4">
      Your browser does not support video.
    </video>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="modalImg">
</div>

<script>
const thumbnails = document.querySelectorAll(".thumbnails img");
const mainImage = document.getElementById("mainImage");
let currentIndex = 0;

function setMainImage(img){
  mainImage.src = img.src;
  thumbnails.forEach(t => t.classList.remove("active"));
  img.classList.add("active");
  currentIndex = [...thumbnails].indexOf(img);
}

function nextImage(){
  currentIndex = (currentIndex+1) % thumbnails.length;
  setMainImage(thumbnails[currentIndex]);
}
function prevImage(){
  currentIndex = (currentIndex-1+thumbnails.length) % thumbnails.length;
  setMainImage(thumbnails[currentIndex]);
}

// Modal
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
function openModal(src){ modal.style.display="flex"; modalImg.src=src; }
function closeModal(){ modal.style.display="none"; }
window.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });
modal.addEventListener("click",(e)=>{ if(e.target===modal) closeModal(); });
</script>

</body>
</html>
